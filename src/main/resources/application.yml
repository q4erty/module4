spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/report_db
    username: report_user
    password: report_pass
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080